name: Brain credential preflight

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Owner/repository. Must be your brain-sandbox repository."
        required: true
        default: "madnessgate44-debug/brain-sandbox"
        type: string

permissions:
  contents: read

concurrency:
  group: brain-credential-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'madnessgate44-debug/brain' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate token and test repository permissions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BRAIN_GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          set -Eeuo pipefail
          set +x

          fail() { echo "::error::$1"; exit 1; }
          [[ -n "${GH_TOKEN:-}" ]] || fail "Missing repository Actions secret BRAIN_GITHUB_TOKEN. Add the fine-grained PAT as a repository secret; token values are never printed."
          [[ "$TARGET_REPOSITORY" == "$OWNER/brain-sandbox" ]] || fail "Target must be exactly $OWNER/brain-sandbox."
          [[ "$TARGET_REPOSITORY" != *$'\n'* && "$TARGET_REPOSITORY" != *$'\r'* ]] || fail "Invalid target repository input."

          export GH_TOKEN
          echo "## Brain credential preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: `$TARGET_REPOSITORY`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Token value: never displayed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          repo_json="$(gh api "repos/$TARGET_REPOSITORY" 2>/dev/null)" || fail "Repository access failed. Confirm brain-sandbox exists, is accessible to this token, and Metadata: read is granted."
          default_branch="$(printf '%s' "$repo_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("default_branch") or "")')"
          [[ -n "$default_branch" ]] || fail "Target repository has no default branch. Add a README.md and ensure the first commit exists."
          echo "- Repository metadata + default branch: PASS (`$default_branch`)" >> "$GITHUB_STEP_SUMMARY"

          # Read-only probes for Actions/Workflows API access. These do not change settings or run workflows.
          gh api "repos/$TARGET_REPOSITORY/actions/permissions" >/dev/null 2>&1 || fail "Actions API read failed. Grant Actions: read (and check repository Actions settings)."
          echo "- Actions API read: PASS" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$TARGET_REPOSITORY/actions/workflows" >/dev/null 2>&1 || fail "Workflows API read failed. Grant Workflows: read."
          echo "- Workflows API read: PASS" >> "$GITHUB_STEP_SUMMARY"

          branch="brain-preflight-$RUN_ID-$RUN_ATTEMPT"
          issue_number=""
          pr_number=""
          cleanup() {
            set +e
            if [[ -n "$pr_number" ]]; then
              gh api --method PATCH "repos/$TARGET_REPOSITORY/pulls/$pr_number" -f state=closed >/dev/null 2>&1
            fi
            if [[ -n "$issue_number" ]]; then
              gh api --method PATCH "repos/$TARGET_REPOSITORY/issues/$issue_number" -f state=closed >/dev/null 2>&1
            fi
            gh api --method DELETE "repos/$TARGET_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1
          }
          trap cleanup EXIT

          base_sha="$(gh api "repos/$TARGET_REPOSITORY/git/ref/heads/$default_branch" --jq '.object.sha' 2>/dev/null)" || fail "Cannot read the default branch ref. Grant Contents: read."
          gh api --method POST "repos/$TARGET_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_sha" >/dev/null 2>&1 || fail "Branch creation failed. Grant Contents: write."
          echo "- Create temporary branch: PASS" >> "$GITHUB_STEP_SUMMARY"

          file_path=".brain-preflight-$RUN_ID.txt"
          file_content="Brain credential preflight run $RUN_ID attempt $RUN_ATTEMPT"
          encoded_content="$(printf '%s' "$file_content" | base64 -w 0)"
          gh api --method PUT "repos/$TARGET_REPOSITORY/contents/$file_path" \
            -f message="test: Brain credential preflight $RUN_ID" \
            -f content="$encoded_content" \
            -f branch="$branch" >/dev/null 2>&1 || fail "Writing a test file failed. Grant Contents: write."
          echo "- Commit a temporary test file: PASS" >> "$GITHUB_STEP_SUMMARY"

          pr_json="$(gh api --method POST "repos/$TARGET_REPOSITORY/pulls" \
            -f title="Temporary Brain credential preflight $RUN_ID" \
            -f head="$branch" -f base="$default_branch" \
            -f body="Automated credential preflight. This PR is closed by the workflow and is not intended to merge." 2>/dev/null)" || fail "Opening a test pull request failed. Grant Pull requests: write."
          pr_number="$(printf '%s' "$pr_json" | python -c 'import json,sys; print(json.load(sys.stdin)["number"])')"
          echo "- Open temporary pull request: PASS (#$pr_number)" >> "$GITHUB_STEP_SUMMARY"
          gh api --method PATCH "repos/$TARGET_REPOSITORY/pulls/$pr_number" -f state=closed >/dev/null 2>&1 || fail "Could not close the temporary pull request. Grant Pull requests: write."
          pr_number=""
          echo "- Close temporary pull request: PASS" >> "$GITHUB_STEP_SUMMARY"

          issue_json="$(gh api --method POST "repos/$TARGET_REPOSITORY/issues" \
            -f title="Temporary Brain credential preflight $RUN_ID" \
            -f body="Automated permission probe. This issue is closed by the workflow." 2>/dev/null)" || fail "Creating a test issue failed. Grant Issues: write."
          issue_number="$(printf '%s' "$issue_json" | python -c 'import json,sys; print(json.load(sys.stdin)["number"])')"
          echo "- Create temporary issue: PASS (#$issue_number)" >> "$GITHUB_STEP_SUMMARY"
          gh api --method PATCH "repos/$TARGET_REPOSITORY/issues/$issue_number" -f state=closed >/dev/null 2>&1 || fail "Could not close the temporary issue. Grant Issues: write."
          issue_number=""
          echo "- Close temporary issue: PASS" >> "$GITHUB_STEP_SUMMARY"

          gh api --method DELETE "repos/$TARGET_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || fail "Could not delete the temporary branch. Grant Contents: write."
          trap - EXIT
          echo "- Delete temporary branch: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result: PASS for metadata, Actions/Workflows API read, Contents branch/file writes, Pull requests create/close, and Issues create/close.**" >> "$GITHUB_STEP_SUMMARY"
          echo "Actions/Workflows write permission is not exercised because the sandbox should not need a workflow dispatch for credential validation. No secrets were printed."
