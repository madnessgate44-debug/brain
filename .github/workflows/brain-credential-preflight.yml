name: Brain credential preflight

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Owner/repository. Allow-list: Meshmesh-, smart-farm, brain-sandbox."
        required: true
        default: "madnessgate44-debug/Meshmesh-"
        type: string
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: brain-credential-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'madnessgate44-debug/brain' &&
      (
        (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
        (
          github.event_name == 'issues' &&
          github.event.issue.state == 'open' &&
          github.event.issue.user.login == github.repository_owner &&
          contains(github.event.issue.body, '/brain preflight')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Probe BRAIN_GITHUB_TOKEN on the allow-listed target
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BRAIN_GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ inputs.target_repository }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          set +x
          results=/tmp/preflight-results.txt
          : > "$results"
          failures=0
          target=""
          branch="brain-preflight-${RUN_ID}-${RUN_ATTEMPT}"
          branch_created=0
          pr_number=""
          issue_number=""

          record() {
            printf '%s|%s|%s\n' "$1" "$2" "$3" >> "$results"
            if [ "$1" = "FAIL" ]; then failures=$((failures + 1)); fi
          }

          cleanup() {
            set +e
            if [ -n "$pr_number" ]; then gh api --method PATCH "repos/$target/pulls/$pr_number" -f state=closed >/dev/null 2>&1; fi
            if [ -n "$issue_number" ]; then gh api --method PATCH "repos/$target/issues/$issue_number" -f state=closed >/dev/null 2>&1; fi
            if [ "$branch_created" = "1" ]; then gh api --method DELETE "repos/$target/git/refs/heads/$branch" >/dev/null 2>&1; fi
          }
          trap cleanup EXIT

          target="$DISPATCH_TARGET"
          if [ "$EVENT_NAME" = "issues" ]; then
            target="$(printf '%s\n' "$ISSUE_BODY" | tr -d '\r' | sed -nE 's/^[[:space:]]*(repo|repository):[[:space:]]*([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)[[:space:]]*$/\2/p' | head -n 1)" || true
            if [ -z "$target" ]; then target="$OWNER/Meshmesh-"; fi
          fi

          case "$target" in
            "$OWNER/Meshmesh-"|"$OWNER/smart-farm"|"$OWNER/brain-sandbox") allowed=1 ;;
            *) allowed=0 ;;
          esac
          if [ "$allowed" != "1" ]; then
            record FAIL "Allow-list" "target must be Meshmesh-, smart-farm or brain-sandbox"
            echo "target=BLOCKED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

          if [ -z "${GH_TOKEN:-}" ]; then
            record FAIL "Token present" "secret BRAIN_GITHUB_TOKEN is missing or empty"
            exit 1
          fi
          record PASS "Token present" ""

          default_branch=""
          if repo_json="$(gh api "repos/$target" 2>/dev/null)"; then
            record PASS "Metadata read" ""
            default_branch="$(printf '%s' "$repo_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("default_branch") or "")')"
          else
            record FAIL "Metadata read" "Metadata: read, or this token does not include the repository"
          fi

          base_sha=""
          if [ -n "$default_branch" ] && base_sha="$(gh api "repos/$target/git/ref/heads/$default_branch" --jq '.object.sha' 2>/dev/null)"; then
            record PASS "Default-branch read" ""
          else
            base_sha=""
            record FAIL "Default-branch read" "Contents: read, or the repository has no commits"
          fi

          if [ -n "$base_sha" ] && gh api --method POST "repos/$target/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_sha" >/dev/null 2>&1; then
            branch_created=1
            record PASS "Branch create" ""
          else
            record FAIL "Branch create" "Contents: write"
          fi

          file_ok=0
          if [ "$branch_created" = "1" ]; then
            encoded="$(printf 'Brain preflight run %s attempt %s' "$RUN_ID" "$RUN_ATTEMPT" | base64 -w 0)"
            if gh api --method PUT "repos/$target/contents/.brain-preflight-$RUN_ID.txt" -f message="test: Brain credential preflight $RUN_ID" -f content="$encoded" -f branch="$branch" >/dev/null 2>&1; then
              file_ok=1
              record PASS "File commit" ""
            else
              record FAIL "File commit" "Contents: write"
            fi
          else
            record FAIL "File commit" "skipped: branch was not created"
          fi

          if [ "$file_ok" = "1" ]; then
            if pr_json="$(gh api --method POST "repos/$target/pulls" -f title="Temporary Brain preflight $RUN_ID" -f head="$branch" -f base="$default_branch" -f body="Temporary permission probe. Closed automatically; never merge." 2>/dev/null)"; then
              pr_number="$(printf '%s' "$pr_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')"
              record PASS "PR open" ""
            else
              record FAIL "PR open" "Pull requests: write"
            fi
          else
            record FAIL "PR open" "skipped: no committed file"
          fi

          if [ -n "$pr_number" ]; then
            if gh api --method PATCH "repos/$target/pulls/$pr_number" -f state=closed >/dev/null 2>&1; then
              pr_number=""
              record PASS "PR close" ""
            else
              record FAIL "PR close" "Pull requests: write"
            fi
          else
            record FAIL "PR close" "skipped: no PR was opened"
          fi

          if issue_json="$(gh api --method POST "repos/$target/issues" -f title="Temporary Brain preflight $RUN_ID" -f body="Temporary permission probe. Closed automatically." 2>/dev/null)"; then
            issue_number="$(printf '%s' "$issue_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')"
            record PASS "Issue create" ""
          else
            record FAIL "Issue create" "Issues: write"
          fi

          if [ -n "$issue_number" ]; then
            if gh api --method PATCH "repos/$target/issues/$issue_number" -f state=closed >/dev/null 2>&1; then
              issue_number=""
              record PASS "Issue close" ""
            else
              record FAIL "Issue close" "Issues: write"
            fi
          else
            record FAIL "Issue close" "skipped: no issue was created"
          fi

          if [ "$branch_created" = "1" ]; then
            if gh api --method DELETE "repos/$target/git/refs/heads/$branch" >/dev/null 2>&1; then
              branch_created=0
              record PASS "Branch delete" ""
            else
              record FAIL "Branch delete" "Contents: write"
            fi
          else
            record FAIL "Branch delete" "skipped: no branch was created"
          fi

          echo "Probe failures: $failures"
          [ "$failures" -eq 0 ]

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Brain credential preflight"
            echo ""
            if [ -s /tmp/preflight-results.txt ]; then
              while IFS='|' read -r status name hint; do
                if [ "$status" = "FAIL" ] && [ -n "$hint" ]; then
                  echo "- FAIL $name (needs: $hint)"
                else
                  echo "- $status $name"
                fi
              done < /tmp/preflight-results.txt
            else
              echo "- No probe results were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post sanitized result on the control issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET: ${{ steps.probe.outputs.target }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('fs');
            let rows = [];
            try {
              rows = fs.readFileSync('/tmp/preflight-results.txt', 'utf8').split('\n').filter(Boolean);
            } catch (error) {
              rows = [];
            }
            const lines = [
              '## Brain credential preflight',
              '',
              '**Target:** ' + (process.env.TARGET || 'unknown'),
              '**Result:** ' + (process.env.PROBE_OUTCOME === 'success' ? 'PASS' : 'FAIL'),
              ''
            ];
            for (const row of rows) {
              const parts = row.split('|');
              const status = parts[0];
              const name = parts[1];
              const hint = parts[2];
              lines.push('- ' + status + ' ' + name + (status === 'FAIL' && hint ? ' (needs: ' + hint + ')' : ''));
            }
            if (!rows.length) lines.push('- No probe results were produced. Open the run.');
            lines.push('', '**Evidence:** ' + process.env.RUN_URL);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
