name: Brain Task Runner

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  prepare:
    if: github.event.issue.state == 'open' && github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, '/brain test')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      repository: ${{ steps.parse.outputs.repository }}
    steps:
      - name: Parse and validate task target
        id: parse
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          body = event["issue"].get("body") or ""
          current = os.environ["GITHUB_REPOSITORY"]
          owner = current.split("/", 1)[0]
          match = re.search(r"(?im)^(?:repository|repo):\s*([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\s*$", body)
          target = match.group(1) if match else current
          if target.split("/", 1)[0].casefold() != owner.casefold():
              raise SystemExit("Only repositories owned by the Brain repository owner are allowed.")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", target):
              raise SystemExit("Invalid repository format. Use owner/repository.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"repository={target}\n")
          print(f"Validated repository target: {target}")
          PY

  run-tests:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.tests.outputs.summary }}
      exit_code: ${{ steps.tests.outputs.exit_code }}
      check_type: ${{ steps.tests.outputs.check_type }}
      target: ${{ needs.prepare.outputs.repository }}
    steps:
      - name: Check out target repository without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          token: ${{ secrets.BRAIN_GITHUB_TOKEN || github.token }}
          persist-credentials: false
      - name: Detect supported project type
        id: detect
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -f setup.cfg ] || [ -f requirements.txt ]; then
            echo "project_type=python" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "project_type=node" >> "$GITHUB_OUTPUT"
          else
            echo "project_type=unsupported" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.detect.outputs.project_type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        if: steps.detect.outputs.project_type == 'python'
        shell: bash
        run: |
          set -e
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || {
              python -m pip install -e .
              python -m pip install pytest pytest-asyncio httpx
            }
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            python -m pip install pytest
          else
            python -m pip install pytest
          fi
      - name: Set up Node.js
        if: steps.detect.outputs.project_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dependencies
        if: steps.detect.outputs.project_type == 'node'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Run tests or project checks and capture report
        id: tests
        shell: bash
        run: |
          set +e
          result=0
          if [ "${{ steps.detect.outputs.project_type }}" = "python" ]; then
            echo "check_type=pytest" >> "$GITHUB_OUTPUT"
            pytest -q > brain-test-report.txt 2>&1
            result=$?
          elif [ "${{ steps.detect.outputs.project_type }}" = "node" ]; then
            if node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.test) process.exit(1)"; then
              echo "check_type=tests" >> "$GITHUB_OUTPUT"
              node -e "const p=require('./package.json'); const s=p.scripts.test; if(s.includes('vitest')) process.exit(10); if(s.includes('react-scripts test')) process.exit(11); if(s.includes('jest')) process.exit(12); process.exit(13)"
              kind=$?
              if [ "$kind" -eq 10 ]; then npm test -- --run > brain-test-report.txt 2>&1; result=$?
              elif [ "$kind" -eq 11 ]; then CI=true npm test -- --watchAll=false > brain-test-report.txt 2>&1; result=$?
              elif [ "$kind" -eq 12 ]; then npm test -- --runInBand > brain-test-report.txt 2>&1; result=$?
              else npm test > brain-test-report.txt 2>&1; result=$?
              fi
            else
              echo "check_type=build/lint checks" >> "$GITHUB_OUTPUT"
              : > brain-test-report.txt
              if node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.build) process.exit(1)"; then
                echo ">>> npm run build" >> brain-test-report.txt
                npm run build >> brain-test-report.txt 2>&1 || result=$?
              fi
              if node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.lint) process.exit(1)"; then
                echo ">>> npm run lint" >> brain-test-report.txt
                npm run lint >> brain-test-report.txt 2>&1 || result=$?
              fi
              if [ ! -s brain-test-report.txt ]; then
                echo "No test, build, or lint script is available." > brain-test-report.txt
                result=2
              fi
            fi
          else
            echo "check_type=unsupported" >> "$GITHUB_OUTPUT"
            echo "Unsupported project. Expected a Python project manifest or package.json." > brain-test-report.txt
            result=2
          fi
          cat brain-test-report.txt
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 0 ]; then
            echo "summary=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "summary=FAIL" >> "$GITHUB_OUTPUT"
          fi
          tail -n 25 brain-test-report.txt > brain-test-summary.txt
          exit 0
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-test-report
          path: |
            brain-test-report.txt
            brain-test-summary.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Mark test job failed when tests fail
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

  report:
    needs: [prepare, run-tests]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report result on the task issue
        uses: actions/github-script@v7
        env:
          TEST_SUMMARY: ${{ needs.run-tests.outputs.summary }}
          TEST_EXIT_CODE: ${{ needs.run-tests.outputs.exit_code }}
          CHECK_TYPE: ${{ needs.run-tests.outputs.check_type }}
          TARGET_REPOSITORY: ${{ needs.run-tests.outputs.target }}
          TEST_JOB_RESULT: ${{ needs.run-tests.result }}
        with:
          script: |
            const summary = process.env.TEST_SUMMARY || 'EXECUTION_ERROR';
            const exitCode = process.env.TEST_EXIT_CODE || 'not available';
            const target = process.env.TARGET_REPOSITORY || 'not resolved';
            const jobResult = process.env.TEST_JOB_RESULT;
            const body = [
              '## Brain remote test run',
              '',
              '**Target repository:** ' + target,
              '**Result:** ' + summary,
              '**Checks:** ' + (process.env.CHECK_TYPE || 'not available'),
              '**Exit code:** ' + exitCode,
              '**Workflow job:** ' + jobResult,
              '',
              'The complete output is attached to the **brain-test-report** workflow artifact when the test step ran.',
              '',
              'Workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '',
              'Security: this workflow accepts only repositories owned by the Brain repository owner, does not persist checkout credentials, and never executes commands taken from the issue body.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
