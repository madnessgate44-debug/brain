name: Brain Task Runner

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  run-tests:
    if: github.event.issue.state == 'open' && contains(github.event.issue.body, '/brain test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite and capture report
        id: tests
        shell: bash
        run: |
          set +e
          pytest -q > brain-test-report.txt 2>&1
          result=$?
          cat brain-test-report.txt
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 0 ]; then
            echo "summary=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "summary=FAIL" >> "$GITHUB_OUTPUT"
          fi
          tail -n 18 brain-test-report.txt > brain-test-summary.txt
          exit 0
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: brain-test-report
          path: |
            brain-test-report.txt
            brain-test-summary.txt
          if-no-files-found: error
          retention-days: 14
      - name: Report result on the task issue
        uses: actions/github-script@v7
        env:
          TEST_SUMMARY: ${{ steps.tests.outputs.summary }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          TEST_DETAILS: ${{ steps.tests.outputs.summary }}
        with:
          script: |
            const summary = process.env.TEST_SUMMARY;
            const exitCode = process.env.TEST_EXIT_CODE;
            const body = [
              '## Brain test run',
              '',
              '**Result:** ' + summary,
              '**Exit code:** ' + exitCode,
              '',
              'The complete output is attached to the **brain-test-report** workflow artifact.',
              '',
              'Workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '',
              'This task runner executes the fixed test command only. It does not execute commands supplied in the issue body.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
