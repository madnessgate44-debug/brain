name: Watcher learning loop

# The Watcher's learning half (WATCHER.md §4.3/§4.4, §9). Each run watches a quota of
# videos from watcher/knowledge/queue.txt: transcribe, then turn the transcript into a
# teachable lesson (diagnosis + fix + how to teach it). Watched URLs leave the queue so
# the loop advances; the day's work lands as one PR.
#
# Manual dispatch takes one video URL (overrides the queue). The scheduled run drains
# the queue, oldest first, up to the quota.
# Rule: never print a secret value.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "One video/reel URL to watch (blank = drain queue.txt)"
        required: false
      quota:
        description: "How many videos to watch this run (blank = 1)"
        required: false
        default: "1"
      model:
        description: "Local ASR model size (tiny|base|small)"
        required: false
        default: base
      reverse:
        description: "Optional owner/repo to reverse-engineer this run"
        required: false
  schedule:
    - cron: "30 4 * * *"   # 06:30 Africa/Cairo (UTC+2), after the daily cycle

permissions:
  contents: write
  pull-requests: write
  issues: write

# One learning run at a time: a new run cancels an in-flight one, so the queue cannot be
# drained twice concurrently.
concurrency:
  group: watcher-learning
  cancel-in-progress: true

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install transcription deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet yt-dlp faster-whisper imageio-ffmpeg numpy

      - name: Discover what to watch (self-directed)
        if: github.event.inputs.url == ''
        run: |
          # The Watcher finds his own material from the owner's line of work and the open
          # problems (watcher/knowledge/focus.md). No video is ever supplied by the owner.
          quota="${{ github.event.inputs.quota }}"; quota="${quota:-3}"
          case "$quota" in ''|*[!0-9]*) quota=3 ;; esac
          python3 watcher/knowledge/tools/discover.py --limit "$quota" --per-query 5 || true

      - name: Pick the URLs to watch
        id: pick
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          QUOTA: ${{ github.event.inputs.quota }}
        run: |
          quota="${QUOTA:-3}"
          case "$quota" in ''|*[!0-9]*) quota=3 ;; esac
          if [ -n "$INPUT_URL" ]; then
            printf '%s\n' "$INPUT_URL" > /tmp/urls.txt
          elif [ -f watcher/knowledge/queue.txt ]; then
            grep -v '^#' watcher/knowledge/queue.txt | grep -v '^[[:space:]]*$' | head -n "$quota" > /tmp/urls.txt
          else
            : > /tmp/urls.txt
          fi
          count="$(grep -c . /tmp/urls.txt || true)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "to watch (${count}):"; cat /tmp/urls.txt

      - name: Watch each video (transcribe, then learn)
        id: watch
        if: steps.pick.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.OHGeminiAPI }}
        run: |
          model="${{ github.event.inputs.model }}"; model="${model:-base}"
          : > /tmp/skipped.txt
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "=== watching ${url} ==="
            # --no-ai: the transcript only. learn.py does the teaching (one model call).
            python3 watcher/knowledge/tools/transcribe.py "$url" \
              --out watcher/knowledge/video --model "$model" --skip-existing --no-ai 2>&1 | tee /tmp/transcribe.log
            if grep -q "skip: source unavailable" /tmp/transcribe.log; then
              echo "${url}" >> /tmp/skipped.txt
              continue
            fi
            newest="$(grep -oE 'TRANSCRIPT: .*' /tmp/transcribe.log | tail -n 1 | cut -d' ' -f2-)"
            if [ -z "$newest" ] || [ ! -f "$newest" ]; then
              echo "no transcript produced for ${url}; skipping lesson"
              continue
            fi
            python3 watcher/knowledge/tools/learn.py "$newest" \
              --source-label "$url" --out watcher/knowledge/lessons 2>&1 | tee /tmp/learn.log
          done < /tmp/urls.txt
          echo "skipped (source unavailable): $(grep -c . /tmp/skipped.txt || true)"

      - name: Purpose audit (does the code do what the app claims?)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Compares brain/ to the app's stated purpose (watcher/knowledge/purpose.md) and
          # flags claims that are only reachable from tests. Runs every time.
          python3 watcher/knowledge/tools/purpose_audit.py --out watcher/knowledge/audits 2>&1 | tee /tmp/purpose.log

      - name: Reverse-engineer a public repo (WATCHER.md §7)
        if: github.event.inputs.reverse != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.OHGeminiAPI }}
        run: |
          python3 watcher/knowledge/tools/reverse.py "${{ github.event.inputs.reverse }}" \
            --out watcher/knowledge/reverse 2>&1 | tee /tmp/reverse.log

      - name: Publish the day's learning as a pull request (never push main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          # Every URL attempted leaves the queue, so the loop advances (WATCHER.md §4.4).
          if [ -f watcher/knowledge/queue.txt ] && [ -s /tmp/urls.txt ]; then
            grep -vxF -f /tmp/urls.txt watcher/knowledge/queue.txt > /tmp/queue.new || true
            mv /tmp/queue.new watcher/knowledge/queue.txt
          fi
          git add watcher/knowledge
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          stamp="$(date -u +%Y%m%d%H%M)"
          branch="knowledge/learn-${stamp}"
          git checkout -b "$branch"
          git commit -m "knowledge: watch and learn (${stamp})"
          git push origin "$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "knowledge: watch and learn (${stamp})" \
            --body "The Watcher learning loop watched the queued video(s), transcribed them, and wrote a lesson for each (diagnosis + fix + how to teach it). Watched URLs leave the queue so the loop advances (WATCHER.md §4.3/§4.4, §9). CI + Shadow audit gate the merge."
