name: Brain Chat Company Workflow

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: brain-company-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  company-workflow:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain simulate')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
      BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
      BRAIN_AI_MODEL: ${{ secrets.BRAIN_AI_MODEL || 'gemini-3.5-flash-lite' }}
      BRAIN_GITHUB_TOKEN: ${{ secrets.BRAIN_GITHUB_TOKEN || github.token }}
      BRAIN_GITHUB_OWNER: ${{ github.repository_owner }}
      BRAIN_CONTROL_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out Brain
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Brain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Brain's specialist workflow
        id: run
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m brain.company.run_issue_workflow

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-company-result
          path: |
            brain-company-result.md
            brain-company-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Comment verified outcome on the initiating issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'brain-company-result.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').slice(0, 60000)
              : '# Brain company workflow result\n\n**Status: FAILED**\n\nNo report file was produced. See the Actions run for evidence.';
            const body = report + '\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
