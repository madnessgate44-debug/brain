name: Brain Chat Company Workflow

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: brain-company-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  company-workflow:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain simulate')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
      BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
      BRAIN_AI_MODEL: ${{ secrets.BRAIN_AI_MODEL || 'gemini-3.5-flash-lite' }}
      BRAIN_GITHUB_TOKEN: ${{ secrets.BRAIN_GITHUB_TOKEN }}
      BRAIN_GITHUB_ACTIONS_TOKEN: ${{ github.token }}
      BRAIN_GITHUB_OWNER: ${{ github.repository_owner }}
      BRAIN_CONTROL_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out Brain
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Brain
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # GitHub's concurrency groups retain only one pending run. Use an atomic
      # Git ref lease instead so distinct missions wait rather than run Gemini
      # calls concurrently or silently replace one another in the pending slot.
      - name: Acquire shared specialist workflow lock
        id: mission_lock
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            const lockFullRef = 'refs/' + lockRef;
            const timeoutMs = 35 * 60 * 1000;
            const staleMs = 95 * 60 * 1000;
            const started = Date.now();
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            async function readLock() {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: lockRef
              });
              const commit = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: ref.data.object.sha
              });
              const message = commit.data.message || '';
              const match = message.match(/acquired_at=([^\s]+)/);
              const date = match ? Date.parse(match[1]) : Date.parse(commit.data.committer?.date || '');
              return { sha: ref.data.object.sha, message, acquiredAt: date };
            }

            while (Date.now() - started < timeoutMs) {
              let existing = null;
              try {
                existing = await readLock();
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              if (existing) {
                if (Number.isFinite(existing.acquiredAt) && Date.now() - existing.acquiredAt > staleMs) {
                  try {
                    const currentRef = await github.rest.git.getRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: lockRef
                    });
                    if (currentRef.data.object.sha !== existing.sha) {
                      await sleep(1000);
                      continue;
                    }
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: lockRef
                    });
                    core.warning('Removed a stale specialist-workflow lease.');
                    continue;
                  } catch (error) {
                    if (error.status !== 404) core.warning('Could not clear stale lease yet: ' + error.message);
                  }
                }
                await sleep(10000);
                continue;
              }

              const mainRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main'
              });
              const parentSha = mainRef.data.object.sha;
              const parent = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: parentSha
              });
              const acquiredAt = new Date().toISOString();
              const leaseCommit = await github.rest.git.createCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                message: 'Brain company workflow lease run=' + context.runId + ' acquired_at=' + acquiredAt,
                tree: parent.data.tree.sha,
                parents: [parentSha]
              });

              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: lockFullRef,
                  sha: leaseCommit.data.sha
                });
                core.setOutput('acquired', 'true');
                core.setOutput('lock_sha', leaseCommit.data.sha);
                core.info('Acquired shared specialist-workflow lease for run ' + context.runId + '.');
                return;
              } catch (error) {
                if (error.status !== 422 && error.status !== 409) throw error;
                // Another runner won the create-ref race. Retry after observing its lease.
                await sleep(10000);
              }
            }

            throw new Error('Timed out waiting for the shared specialist-workflow lease after 35 minutes. No specialist mission was started.');

      - name: Run Brain's specialist workflow
        id: run
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m brain.company.run_issue_workflow

      - name: Release shared specialist workflow lock
        if: always() && steps.mission_lock.outputs.acquired == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: lockRef
              });
              const commit = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: ref.data.object.sha
              });
              if ((commit.data.message || '').includes('run=' + context.runId)) {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: lockRef
                });
                core.info('Released shared specialist-workflow lease.');
              } else {
                core.warning('Lease now belongs to another run; leaving it intact.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Shared specialist-workflow lease was already cleared.');
            }

      - name: Dispatch and verify post-PR checks
        id: post_pr_verification
        if: success()
        uses: actions/github-script@v7
        timeout-minutes: 25
        with:
          script: |
            const fs = require('fs');
            const { selectMatchingWorkflowRuns, evaluatePostPrVerification } = require('./scripts/post_pr_verification.js');
            const resultPath = 'brain-company-result.json';
            const markdownPath = 'brain-company-result.md';
            if (!fs.existsSync(resultPath)) {
              core.warning('No company workflow result JSON; post-PR verification was not dispatched.');
              return;
            }
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            const branch = result.branch;
            const prUrl = result.pull_request && result.pull_request.url;
            const prMatch = typeof prUrl === 'string' ? prUrl.match(/\/pull\/(\d+)/) : null;
            const prNumber = prMatch ? Number(prMatch[1]) : null;
            if (result.status !== 'READY_FOR_HUMAN_APPROVAL' || !branch || !prNumber) {
              core.info('No successfully created review PR; skipping post-PR verification.');
              return;
            }

            const workflowIds = ['brain-ci.yml', 'tests.yml', 'browser-runtime-smoke.yml'];
            const dispatchStartedAt = {};
            const outcomes = [];
            let initialPr = null;
            let expectedHeadSha = null;
            let expectedHeadRef = null;
            try {
              initialPr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              expectedHeadSha = initialPr.data.head.sha;
              expectedHeadRef = initialPr.data.head.ref;
            } catch (error) {
              outcomes.push({
                workflow: 'PR_HEAD_LOOKUP',
                status: 'LOOKUP_FAILED',
                error: String(error.message || error).slice(0, 500)
              });
            }

            const canDispatch = Boolean(expectedHeadSha && expectedHeadRef === branch);
            if (!canDispatch) {
              outcomes.push({
                workflow: 'PR_HEAD_REF',
                status: 'HEAD_REF_MISMATCH',
                expected_ref: branch,
                actual_ref: expectedHeadRef,
                expected_head_sha: expectedHeadSha
              });
              for (const workflowId of workflowIds) {
                outcomes.push({workflow: workflowId, status: 'NOT_DISPATCHED', conclusion: null, url: null});
              }
            } else {
              for (const workflowId of workflowIds) {
                dispatchStartedAt[workflowId] = Date.now() - 5000;
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: workflowId,
                    ref: branch
                  });
                  core.info('Dispatched ' + workflowId + ' for ' + branch + ' at expected head ' + expectedHeadSha + '.');
                } catch (error) {
                  outcomes.push({
                    workflow: workflowId,
                    status: 'DISPATCH_FAILED',
                    conclusion: null,
                    url: null,
                    error: String(error.message || error).slice(0, 500)
                  });
                }
              }

              const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
              for (const workflowId of workflowIds) {
                if (outcomes.some(item => item.workflow === workflowId)) continue;
                const deadline = Date.now() + 8 * 60 * 1000;
                let completed = null;
                while (Date.now() < deadline) {
                  let response;
                  try {
                    response = await github.rest.actions.listWorkflowRuns({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      workflow_id: workflowId,
                      branch,
                      event: 'workflow_dispatch',
                      per_page: 20
                    });
                  } catch (error) {
                    outcomes.push({
                      workflow: workflowId,
                      status: 'LIST_FAILED',
                      conclusion: null,
                      url: null,
                      error: String(error.message || error).slice(0, 500)
                    });
                    break;
                  }
                  const candidates = selectMatchingWorkflowRuns(
                    response.data.workflow_runs,
                    branch,
                    expectedHeadSha,
                    dispatchStartedAt[workflowId]
                  );
                  const run = candidates[0];
                  if (run && run.status === 'completed') { completed = run; break; }
                  await sleep(10000);
                }
                if (outcomes.some(item => item.workflow === workflowId)) continue;
                outcomes.push(completed
                  ? {
                      workflow: workflowId,
                      status: completed.conclusion === 'success' ? 'PASS' : 'FAIL',
                      conclusion: completed.conclusion,
                      url: completed.html_url,
                      run_id: completed.id,
                      head_sha: completed.head_sha
                    }
                  : {workflow: workflowId, status: 'TIMEOUT', conclusion: null, url: null, head_sha: null});
              }
            }

            let finalHeadSha = null;
            let finalPrState = null;
            try {
              const finalPr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              finalHeadSha = finalPr.data.head.sha;
              finalPrState = finalPr.data.state;
            } catch (error) {
              outcomes.push({
                workflow: 'PR_HEAD_RECHECK',
                status: 'LOOKUP_FAILED',
                error: String(error.message || error).slice(0, 500)
              });
            }

            const evaluation = evaluatePostPrVerification({
              expectedHeadSha,
              finalHeadSha,
              outcomes,
              workflowIds
            });
            const prOpen = finalPrState === 'open';
            const passed = evaluation.passed && prOpen;
            result.post_pr_verification = {
              status: passed ? 'PASS' : 'FAIL',
              expected_head_sha: expectedHeadSha,
              final_head_sha: finalHeadSha,
              head_stable: evaluation.head_stable,
              pr_open: prOpen,
              workflows_passed: evaluation.workflows_passed,
              workflows: outcomes,
              verified_branch: branch
            };
            if (!passed) {
              result.status = 'POST_PR_VERIFICATION_FAILED';
              result.next_action = 'Do not merge this PR. A required check failed, the PR head changed during verification, or the PR could not be revalidated. Inspect outcomes and rerun against the exact current head.';
            }
            fs.writeFileSync(resultPath, JSON.stringify(result, null, 2) + '\n', 'utf8');
            let report = fs.existsSync(markdownPath) ? fs.readFileSync(markdownPath, 'utf8') : '# Brain company workflow result\n';
            if (!passed) report = report.replace('- Status: **READY_FOR_HUMAN_APPROVAL**', '- Status: **POST_PR_VERIFICATION_FAILED**');
            report += '\n## Post-PR verification\n\n- Status: **' + (passed ? 'PASS' : 'FAIL') + '**\n';
            report += '- Expected PR head SHA: ' + (expectedHeadSha || 'UNKNOWN') + '\n';
            report += '- Final PR head SHA: ' + (finalHeadSha || 'UNKNOWN') + '\n';
            report += '- PR head stable: ' + (evaluation.head_stable ? 'YES' : 'NO') + '\n';
            for (const item of outcomes) report += '- ' + item.workflow + ': **' + item.status + '**' + (item.url ? ' — ' + item.url : '') + (item.error ? ' — ' + item.error : '') + (item.head_sha ? ' — SHA ' + item.head_sha : '') + '\n';
            report += '\nThese checks are accepted only when every workflow run matches the expected PR head SHA and the PR still points to that SHA after verification.\n';
            fs.writeFileSync(markdownPath, report, 'utf8');
            const commentLines = [
              '## Brain post-PR verification: ' + (passed ? 'PASS' : 'FAIL'),
              '',
              'Branch: ' + branch,
              'Expected PR head SHA: ' + (expectedHeadSha || 'UNKNOWN'),
              'Final PR head SHA: ' + (finalHeadSha || 'UNKNOWN'),
              'PR head stable: ' + (evaluation.head_stable ? 'YES' : 'NO'),
              '',
              ...outcomes.map(item => '- ' + item.workflow + ': **' + item.status + '**' + (item.url ? ' — ' + item.url : '') + (item.error ? ' — ' + item.error : '') + (item.head_sha ? ' — SHA ' + item.head_sha : ''))
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentLines.join('\n')
            });
            if (!passed) core.setFailed('Post-PR checks failed, the PR head changed, or the PR could not be revalidated.');
      - name: Ensure failure diagnostics exist
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LOCK_OUTCOME: ${{ steps.mission_lock.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        shell: bash
        run: |
          if [[ -f scripts/write_bootstrap_failure_report.py ]]; then
            python3 scripts/write_bootstrap_failure_report.py
          else
            # Checkout itself can fail, so retain a self-contained standard-library fallback.
            python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          event_payload = {}
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          if event_path:
              try:
                  with open(event_path, encoding="utf-8") as handle:
                      parsed = json.load(handle)
                  if isinstance(parsed, dict):
                      event_payload = parsed
              except (OSError, json.JSONDecodeError):
                  pass

          issue = event_payload.get("issue")
          issue_number = issue.get("number") if isinstance(issue, dict) else None
          outcomes = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME", "unknown"),
              "setup_python": os.environ.get("SETUP_PYTHON_OUTCOME", "unknown"),
              "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
              "lease": os.environ.get("LOCK_OUTCOME", "unknown"),
              "mission_runner": os.environ.get("RUN_OUTCOME", "unknown"),
          }
          failed_steps = [
              {"step": step, "outcome": outcome}
              for step, outcome in outcomes.items()
              if str(outcome).casefold() in {"failure", "cancelled", "timed_out"}
          ]
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com").rstrip("/")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server_url}/{repository}/actions/runs/{run_id}" if repository and run_id else ""
          recovery = (
              "Inspect the failed Actions step and complete logs. Do not infer repository mutation "
              "or test success without the mission runner's own evidence."
          )
          report = {
              "schema_version": "1.1",
              "status": "FAILED",
              "failure": {
                  "type": "WorkflowBootstrapFailure",
                  "message": "Brain did not produce its own execution report; a workflow bootstrap, lease, or reporting stage failed.",
                  "traceback": None,
                  "probable_location": "GitHub Actions workflow step before or around Python mission execution",
              },
              "runtime": {
                  "failed_at": datetime.now(timezone.utc).isoformat(),
                  "repository": repository,
                  "commit_sha": os.environ.get("GITHUB_SHA", ""),
                  "ref": os.environ.get("GITHUB_REF", ""),
                  "ref_name": os.environ.get("GITHUB_REF_NAME", ""),
                  "run_id": run_id,
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
                  "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
                  "event_action": event_payload.get("action"),
                  "issue_number": issue_number,
                  "workflow_run_url": run_url,
                  "runner_os": os.environ.get("RUNNER_OS", ""),
                  "python": sys.version,
              },
              "step_outcomes": outcomes,
              "failed_steps": failed_steps,
              "impact": {
                  "success_claimed": False,
                  "repository_mutation_status": "UNKNOWN; mission runner did not provide evidence",
                  "tests_status": "UNKNOWN; mission runner did not provide evidence",
              },
              "recovery": {"attempted": False, "next_step": recovery},
          }
          if not os.path.exists("brain-company-result.json"):
              with open("brain-company-result.json", "w", encoding="utf-8") as handle:
                  json.dump(report, handle, ensure_ascii=False, indent=2)
          if not os.path.exists("brain-company-result.md"):
              runtime = report["runtime"]
              failure = report["failure"]
              impact = report["impact"]
              lines = [
                  "# Brain execution failure report",
                  "",
                  f"- Status: {report['status']}",
                  f"- Failure type: {failure['type']}",
                  f"- Repository: {runtime['repository']}",
                  f"- Commit SHA: {runtime['commit_sha']}",
                  f"- Ref: {runtime['ref']} ({runtime['ref_name']})",
                  f"- Workflow run: {runtime['run_id']} attempt {runtime['run_attempt']}",
                  f"- Run URL: {runtime['workflow_run_url']}",
                  f"- Workflow/event/action: {runtime['workflow']} / {runtime['event_name']} / {runtime['event_action']}",
                  f"- Initiating issue: {runtime['issue_number']}",
                  f"- Mutation status: {impact['repository_mutation_status']}",
                  f"- Tests status: {impact['tests_status']}",
                  "",
                  "## Step outcomes",
                  json.dumps(outcomes, indent=2),
                  "",
                  "## Failed steps",
                  json.dumps(failed_steps, indent=2),
                  "",
                  "## Failure detail",
                  failure["message"],
                  "",
                  "## Next action",
                  recovery,
                  "",
              ]
              with open("brain-company-result.md", "w", encoding="utf-8") as handle:
                  handle.write("\n".join(lines))
          PY
          fi
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-company-result
          path: |
            brain-company-result.md
            brain-company-result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Comment verified outcome on the initiating issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'brain-company-result.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').slice(0, 60000)
              : '# Brain company workflow result\n\n**Status: FAILED**\n\nNo report file was produced. See the Actions run for evidence.';
            const body = report + '\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
