name: Brain Chat Company Workflow

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: brain-company-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  company-workflow:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain simulate')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      BRAIN_AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.BRAIN_AI_API_KEY }}
      BRAIN_AI_BASE_URL: ${{ secrets.DEEPSEEK_API_KEY && 'https://api.deepseek.com/v1' || secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
      BRAIN_AI_MODEL: ${{ secrets.DEEPSEEK_API_KEY && 'deepseek-chat' || secrets.BRAIN_AI_MODEL || 'gemini-3.5-flash-lite' }}
      BRAIN_GITHUB_TOKEN: ${{ secrets.BRAIN_GITHUB_TOKEN }}
      BRAIN_GITHUB_ACTIONS_TOKEN: ${{ github.token }}
      BRAIN_GITHUB_OWNER: ${{ github.repository_owner }}
      BRAIN_CONTROL_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out Brain
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Brain
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # GitHub's concurrency groups retain only one pending run. Use an atomic
      # Git ref lease instead so distinct missions wait rather than run Gemini
      # calls concurrently or silently replace one another in the pending slot.
      - name: Acquire shared specialist workflow lock
        id: mission_lock
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            const lockFullRef = 'refs/' + lockRef;
            const timeoutMs = 35 * 60 * 1000;
            const staleMs = 95 * 60 * 1000;
            const started = Date.now();
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            async function readLock() {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: lockRef
              });
              const commit = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: ref.data.object.sha
              });
              const message = commit.data.message || '';
              const match = message.match(/acquired_at=([^\s]+)/);
              const date = match ? Date.parse(match[1]) : Date.parse(commit.data.committer?.date || '');
              return { sha: ref.data.object.sha, message, acquiredAt: date };
            }

            while (Date.now() - started < timeoutMs) {
              let existing = null;
              try {
                existing = await readLock();
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              if (existing) {
                if (Number.isFinite(existing.acquiredAt) && Date.now() - existing.acquiredAt > staleMs) {
                  try {
                    const currentRef = await github.rest.git.getRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: lockRef
                    });
                    if (currentRef.data.object.sha !== existing.sha) {
                      await sleep(1000);
                      continue;
                    }
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: lockRef
                    });
                    core.warning('Removed a stale specialist-workflow lease.');
                    continue;
                  } catch (error) {
                    if (error.status !== 404) core.warning('Could not clear stale lease yet: ' + error.message);
                  }
                }
                await sleep(10000);
                continue;
              }

              const mainRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main'
              });
              const parentSha = mainRef.data.object.sha;
              const parent = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: parentSha
              });
              const acquiredAt = new Date().toISOString();
              const leaseCommit = await github.rest.git.createCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                message: 'Brain company workflow lease run=' + context.runId + ' acquired_at=' + acquiredAt,
                tree: parent.data.tree.sha,
                parents: [parentSha]
              });

              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: lockFullRef,
                  sha: leaseCommit.data.sha
                });
                core.setOutput('acquired', 'true');
                core.setOutput('lock_sha', leaseCommit.data.sha);
                core.info('Acquired shared specialist-workflow lease for run ' + context.runId + '.');
                return;
              } catch (error) {
                if (error.status !== 422 && error.status !== 409) throw error;
                // Another runner won the create-ref race. Retry after observing its lease.
                await sleep(10000);
              }
            }

            throw new Error('Timed out waiting for the shared specialist-workflow lease after 35 minutes. No specialist mission was started.');

      - name: Run Brain's specialist workflow
        id: run
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m brain.company.run_issue_workflow

      - name: Release shared specialist workflow lock
        if: always() && steps.mission_lock.outputs.acquired == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: lockRef
              });
              const commit = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: ref.data.object.sha
              });
              const leaseRun = ((commit.data.message || '').match(/(?:^|\s)run=(\d+)(?:\s|$)/) || [])[1];
              if (leaseRun === String(context.runId)) {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: lockRef
                });
                core.info('Released shared specialist-workflow lease.');
              } else {
                core.warning('Lease now belongs to another run; leaving it intact.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Shared specialist-workflow lease was already cleared.');
            }

      - name: Ensure failure diagnostics exist
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LOCK_OUTCOME: ${{ steps.mission_lock.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          if not (os.path.exists('brain-company-result.md') and os.path.exists('brain-company-result.json')):
              report = {
                  'schema_version': '1.0',
                  'status': 'FAILED',
                  'failure': {
                      'type': 'WorkflowBootstrapFailure',
                      'message': 'Brain did not produce its own execution report; a workflow bootstrap, lease, or reporting stage failed.',
                      'traceback': None,
                      'probable_location': 'GitHub Actions workflow step before or around Python mission execution',
                  },
                  'runtime': {
                      'failed_at': datetime.now(timezone.utc).isoformat(),
                      'repository': os.environ.get('GITHUB_REPOSITORY'),
                      'run_id': os.environ.get('GITHUB_RUN_ID'),
                      'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                      'workflow': os.environ.get('GITHUB_WORKFLOW'),
                      'event_name': os.environ.get('GITHUB_EVENT_NAME'),
                      'runner_os': os.environ.get('RUNNER_OS'),
                      'python': os.sys.version,
                  },
                  'step_outcomes': {
                      'checkout': os.environ.get('CHECKOUT_OUTCOME'),
                      'setup_python': os.environ.get('SETUP_PYTHON_OUTCOME'),
                      'install': os.environ.get('INSTALL_OUTCOME'),
                      'lease': os.environ.get('LOCK_OUTCOME'),
                      'mission_runner': os.environ.get('RUN_OUTCOME'),
                  },
                  'impact': {'success_claimed': False, 'repository_mutation_status': 'UNKNOWN; inspect job logs', 'tests_status': 'UNKNOWN; mission runner may not have started'},
                  'recovery': {'attempted': False, 'next_step': 'Inspect the failed step and its complete Actions logs. The normal mission diagnostic was not produced.'},
              }
              if not os.path.exists('brain-company-result.json'):
                  with open('brain-company-result.json', 'w', encoding='utf-8') as handle:
                      json.dump(report, handle, ensure_ascii=False, indent=2)
              if not os.path.exists('brain-company-result.md'):
                  with open('brain-company-result.md', 'w', encoding='utf-8') as handle:
                      handle.write('\n'.join([
                          '# Brain execution failure report',
                          '',
                          '**Status: FAILED — workflow bootstrap did not produce a mission report.**',
                          '',
                          '## Workflow context',
                          '',
                          json.dumps(report['runtime'], indent=2),
                          '',
                          '## Step outcomes',
                          '',
                          json.dumps(report['step_outcomes'], indent=2),
                          '',
                          '## Failure interpretation',
                          '',
                          report['failure']['message'],
                          '',
                          '## Next action',
                          '',
                          report['recovery']['next_step'],
                      ]) + '\n')
          PY
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-company-result
          path: |
            brain-company-result.md
            brain-company-result.json
            brain-company-checkpoint.json
          if-no-files-found: warn
          retention-days: 14

      - name: Comment verified outcome on the initiating issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'brain-company-result.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').slice(0, 60000)
              : '# Brain company workflow result\n\n**Status: FAILED**\n\nNo report file was produced. See the Actions run for evidence.';
            const body = report + '\n\nWorkflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
