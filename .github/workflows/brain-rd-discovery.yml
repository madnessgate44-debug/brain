name: Brain R&D Discovery

on:
  workflow_dispatch:
    inputs:
      mission:
        description: "Research mission (what Brain must investigate)"
        required: true
        type: string
        default: "Design Tomatom, a free-first browser automation platform for Brain. Investigate relevant open-source browser automation repositories, browser extension support, browser control and security, free hosting and persistence limits, and the skills/job requirements needed to build and operate it. Return an evidence-linked recommendation and roadmap."
      max_candidates:
        description: "Maximum repository candidates to inspect (1-50)"
        required: true
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "50"
        default: "30"

permissions:
  contents: read

concurrency:
  group: brain-rd-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BRAIN_RD_ENABLE_MODEL_ASSESSMENT: ${{ vars.BRAIN_RD_ENABLE_MODEL_ASSESSMENT || 'false' }}
      BRAIN_RD_MISSION: ${{ inputs.mission || 'Design Tomatom, a free-first browser automation platform for Brain. Investigate open-source browser automation repositories, browser extensions, browser control/security, free hosting/persistence limits, and required skills/job-market evidence. Return an evidence-linked recommendation and roadmap.' }}
      BRAIN_RD_MAX_CANDIDATES: ${{ inputs.max_candidates || '30' }}
    steps:
      - name: Check out Brain
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Brain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Validate model configuration when model assessment is enabled
        if: env.BRAIN_RD_ENABLE_MODEL_ASSESSMENT == 'true'
        shell: bash
        env:
          MODEL_NAME: ${{ vars.BRAIN_AI_MODEL }}
        run: |
          set +x
          if [ -z "${MODEL_NAME:-}" ]; then
            echo "::error::Repository variable BRAIN_AI_MODEL is missing; model assessment cannot run without an explicit model."
            exit 1
          fi
          if [[ ! "$MODEL_NAME" =~ ^[A-Za-z0-9._:/-]+$ ]]; then
            echo "::error::BRAIN_AI_MODEL contains unsupported characters."
            exit 1
          fi

      - name: Acquire shared model-workflow queue lease
        id: mission_lock
        if: env.BRAIN_RD_ENABLE_MODEL_ASSESSMENT == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            const lockFullRef = 'refs/' + lockRef;
            const started = Date.now();
            const timeoutMs = 35 * 60 * 1000;
            const staleMs = 95 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            while (Date.now() - started < timeoutMs) {
              let existing = null;
              try {
                const ref = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                const commit = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: ref.data.object.sha});
                const match = (commit.data.message || '').match(/acquired_at=([^\\s]+)/);
                const acquiredAt = match ? Date.parse(match[1]) : Date.parse(commit.data.committer?.date || '');
                existing = {sha: ref.data.object.sha, acquiredAt};
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (existing) {
                if (Number.isFinite(existing.acquiredAt) && Date.now() - existing.acquiredAt > staleMs) {
                  const current = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                  if (current.data.object.sha === existing.sha) {
                    await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                    core.warning('Removed stale shared model-workflow lease.');
                    continue;
                  }
                }
                await sleep(10000);
                continue;
              }
              const mainRef = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main'});
              const parentSha = mainRef.data.object.sha;
              const parent = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: parentSha});
              const acquiredAt = new Date().toISOString();
              const lease = await github.rest.git.createCommit({
                owner: context.repo.owner, repo: context.repo.repo,
                message: 'Brain shared model lease run=' + context.runId + ' acquired_at=' + acquiredAt,
                tree: parent.data.tree.sha, parents: [parentSha]
              });
              try {
                await github.rest.git.createRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockFullRef, sha: lease.data.sha});
                core.setOutput('acquired', 'true');
                core.info('Acquired shared model-workflow lease.');
                return;
              } catch (error) {
                if (error.status !== 422 && error.status !== 409) throw error;
                await sleep(10000);
              }
            }
            throw new Error('Timed out waiting for shared model-workflow lease; no model call was started.');

      - name: Run bounded R&D discovery
        env:
          # Preserve compatibility with the existing Brain Actions token secret.
          BRAIN_RD_GITHUB_TOKEN: ${{ secrets.BRAIN_RD_GITHUB_TOKEN || secrets.BRAIN_GITHUB_TOKEN }}
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
          BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          BRAIN_AI_MODEL: ${{ vars.BRAIN_AI_MODEL }}
        run: python -m brain.research.cli --max-candidates "$BRAIN_RD_MAX_CANDIDATES" --mission "$BRAIN_RD_MISSION" --output-dir .
      - name: Release shared model-workflow queue lease
        if: always() && steps.mission_lock.outputs.acquired == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            try {
              const ref = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
              const commit = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: ref.data.object.sha});
              if ((commit.data.message || '').includes('run=' + context.runId)) {
                await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                core.info('Released shared model-workflow lease.');
              } else {
                core.warning('Lease belongs to another run; it was not deleted.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Add shortlist to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f brain-rd-report.md ]; then
            cat brain-rd-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "R&D report was not produced. Inspect the failed workflow step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload R&D report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-rd-discovery-report
          path: |
            brain-rd-report.md
            brain-rd-report.json
          if-no-files-found: warn
          retention-days: 30
