name: Brain R&D Discovery

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      mission:
        description: "Research mission (what Brain must investigate)"
        required: true
        type: string
        default: "Design Tomatom, a free-first browser automation platform for Brain. Investigate relevant open-source browser automation repositories, browser extension support, browser control and security, free hosting and persistence limits, and the skills/job requirements needed to build and operate it. Return an evidence-linked recommendation and roadmap."
      max_candidates:
        description: "Maximum repository candidates to inspect (1-50)"
        required: true
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "50"
        default: "30"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: brain-rd-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRAIN_RD_ENABLE_MODEL_ASSESSMENT: ${{ vars.BRAIN_RD_ENABLE_MODEL_ASSESSMENT || 'false' }}
      BRAIN_RD_MISSION: ${{ inputs.mission || 'Find tools that improve Brain research, coding, browser automation, testing, and free execution.' }}
      BRAIN_RD_MAX_CANDIDATES: ${{ inputs.max_candidates || '30' }}
    steps:
      - name: Check out Brain
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Brain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run bounded R&D discovery
        env:
          BRAIN_RD_GITHUB_TOKEN: ${{ secrets.BRAIN_RD_GITHUB_TOKEN }}
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
          BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          BRAIN_AI_MODEL: ${{ secrets.BRAIN_AI_MODEL || 'gemini-3.5-flash-lite' }}
        run: python -m brain.research.cli --max-candidates "$BRAIN_RD_MAX_CANDIDATES" --mission "$BRAIN_RD_MISSION" --output-dir .
      - name: Add shortlist to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f brain-rd-report.md ]; then
            cat brain-rd-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "R&D report was not produced. Inspect the failed workflow step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload R&D report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-rd-discovery-report
          path: |
            brain-rd-report.md
            brain-rd-report.json
          if-no-files-found: warn
          retention-days: 30
