name: Brain free-first public web research

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: brain-public-research-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  browse:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain browse')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out Brain without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Brain and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Plan and execute bounded public research
        id: research
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
          BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          BRAIN_AI_MODEL: ${{ secrets.BRAIN_AI_MODEL || 'gemini-3.5-flash-lite' }}
        run: python scripts/run_browser_research_issue.py

      - name: Upload plan, report, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-public-research-${{ github.event.issue.number }}
          path: browser-output/
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: browse
    if: always() && github.event.issue.user.login == github.repository_owner && github.event.sender.login == github.repository_owner && contains(github.event.issue.body, '/brain browse')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download research artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brain-public-research-${{ github.event.issue.number }}
          path: browser-output/

      - name: Comment verified result on the issue
        uses: actions/github-script@v7
        env:
          BROWSE_JOB_RESULT: ${{ needs.browse.result }}
        with:
          script: |
            const fs = require('fs');
            const path = 'browser-output/browser-result.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '## Brain public-web research: FAILED\n\nNo result report was produced. Inspect the workflow logs.';
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = report + '\n\n**Workflow job:** ' + (process.env.BROWSE_JOB_RESULT || 'unknown') + '\n**Evidence:** ' + runUrl;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
