name: Brain free-first public web research

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: brain-public-research-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  browse:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain browse')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out Brain without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Brain and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate provider configuration
        shell: bash
        env:
          MODEL_NAME: ${{ vars.BRAIN_AI_MODEL }}
        run: |
          set +x
          if [ -z "${MODEL_NAME:-}" ]; then
            echo "::error::Repository variable BRAIN_AI_MODEL is missing. No research model will be selected implicitly."
            exit 1
          fi
          if [[ ! "$MODEL_NAME" =~ ^[A-Za-z0-9._:/-]+$ ]]; then
            echo "::error::BRAIN_AI_MODEL contains unsupported characters."
            exit 1
          fi

      - name: Acquire shared model-workflow queue lease
        id: mission_lock
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            const lockFullRef = 'refs/' + lockRef;
            const started = Date.now();
            const timeoutMs = 35 * 60 * 1000;
            const staleMs = 95 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            while (Date.now() - started < timeoutMs) {
              let existing = null;
              try {
                const ref = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                const commit = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: ref.data.object.sha});
                const match = (commit.data.message || '').match(/acquired_at=([^\\s]+)/);
                const acquiredAt = match ? Date.parse(match[1]) : Date.parse(commit.data.committer?.date || '');
                existing = {sha: ref.data.object.sha, acquiredAt};
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (existing) {
                if (Number.isFinite(existing.acquiredAt) && Date.now() - existing.acquiredAt > staleMs) {
                  const current = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                  if (current.data.object.sha === existing.sha) {
                    await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                    core.warning('Removed stale shared model-workflow lease.');
                    continue;
                  }
                }
                await sleep(10000);
                continue;
              }
              const mainRef = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main'});
              const parentSha = mainRef.data.object.sha;
              const parent = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: parentSha});
              const acquiredAt = new Date().toISOString();
              const lease = await github.rest.git.createCommit({
                owner: context.repo.owner, repo: context.repo.repo,
                message: 'Brain shared model lease run=' + context.runId + ' acquired_at=' + acquiredAt,
                tree: parent.data.tree.sha, parents: [parentSha]
              });
              try {
                await github.rest.git.createRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockFullRef, sha: lease.data.sha});
                core.setOutput('acquired', 'true');
                core.info('Acquired shared model-workflow lease.');
                return;
              } catch (error) {
                if (error.status !== 422 && error.status !== 409) throw error;
                await sleep(10000);
              }
            }
            throw new Error('Timed out waiting for shared model-workflow lease; no model call was started.');

      - name: Plan and execute bounded public research
        id: research
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
          BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          BRAIN_AI_MODEL: ${{ vars.BRAIN_AI_MODEL }}
        run: python scripts/run_browser_research_issue.py

      - name: Release shared model-workflow queue lease
        if: always() && steps.mission_lock.outputs.acquired == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const lockRef = 'heads/brain-company-workflow-lock';
            try {
              const ref = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
              const commit = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: ref.data.object.sha});
              if ((commit.data.message || '').includes('run=' + context.runId)) {
                await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: lockRef});
                core.info('Released shared model-workflow lease.');
              } else {
                core.warning('Lease belongs to another run; it was not deleted.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Upload plan, report, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-public-research-${{ github.event.issue.number }}
          path: browser-output/
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: browse
    if: always() && github.event.issue.user.login == github.repository_owner && github.event.sender.login == github.repository_owner && contains(github.event.issue.body, '/brain browse')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download research artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: brain-public-research-${{ github.event.issue.number }}
          path: browser-output/

      - name: Comment verified result on the issue
        uses: actions/github-script@v7
        env:
          BROWSE_JOB_RESULT: ${{ needs.browse.result }}
        with:
          script: |
            const fs = require('fs');
            const path = 'browser-output/browser-result.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '## Brain public-web research: FAILED\n\nNo result report was produced. Inspect the workflow logs.';
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = report + '\n\n**Workflow job:** ' + (process.env.BROWSE_JOB_RESULT || 'unknown') + '\n**Evidence:** ' + runUrl;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
