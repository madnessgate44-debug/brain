name: Shadow key sweep

# Implements WATCHER.md §14.4: every 6 hours (plus manual dispatch) test every registered
# key and model with a minimal real request, and record PASS/FAIL. Never prints a value.
# Rule: this workflow never prints, echoes, or commits a secret value. Output is PASS/FAIL only.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sweep every registered Gemini key x model
        env:
          K1: ${{ secrets.GEMINI_POOL_1 }}
          K2: ${{ secrets.GEMINI_POOL_2 }}
          K3: ${{ secrets.GEMINI_POOL_3 }}
          K4: ${{ secrets.GEMINI_POOL_4 }}
          K5: ${{ secrets.GEMINI_POOL_5 }}
          K6: ${{ secrets.GEMINI_POOL_6 }}
          K7: ${{ secrets.GEMINI_POOL_7 }}
          KORG: ${{ secrets.OHGeminiAPI }}
        run: |
          set +e
          BASE="https://generativelanguage.googleapis.com/v1beta"
          # Keep in sync with shadow/keypool.py MODELS.
          MODELS="gemini-2.5-flash gemini-flash-lite-latest gemini-3-flash-preview gemini-3.1-flash-lite-preview"
          missing=0; working=0
          echo "label|models_http|generate_http|result"
          echo "-----|-----------|-------------|------"
          for pair in "GEMINI_POOL_1:$K1" "GEMINI_POOL_2:$K2" "GEMINI_POOL_3:$K3" \
                      "GEMINI_POOL_4:$K4" "GEMINI_POOL_5:$K5" "GEMINI_POOL_6:$K6" \
                      "GEMINI_POOL_7:$K7" "OHGeminiAPI:$KORG"; do
            label="${pair%%:*}"; key="${pair#*:}"
            if [ -z "$key" ]; then
              echo "${label}|-|-|NOT SET (secret absent)"
              missing=$((missing + 1))
              continue
            fi
            mcode=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-goog-api-key: ${key}" "${BASE}/models")
            gcode="skip"
            for m in $MODELS; do
              c=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "x-goog-api-key: ${key}" -H "Content-Type: application/json" \
                -d '{"contents":[{"parts":[{"text":"ok"}]}]}' \
                "${BASE}/models/${m}:generateContent")
              if [ "$c" = "200" ]; then gcode="$c"; break; fi
              gcode="$c"
            done
            if [ "$mcode" = "200" ] && [ "$gcode" = "200" ]; then res="WORKING"; working=$((working + 1));
            elif [ "$gcode" = "429" ]; then res="RATE-LIMITED";
            else res="FAIL"; fi
            echo "${label}|${mcode}|${gcode}|${res}"
          done
          echo "sweep complete; values never printed."
          echo "SUMMARY: ${working} WORKING, ${missing} NOT SET"
          if [ "$working" -eq 0 ]; then
            echo "::warning::No Gemini key is set in this repository, so no route was tested. Add OHGeminiAPI + GEMINI_POOL_1..7 (WATCHER.md §14.2). A green sweep here does not mean the pool is healthy."
          fi

      - name: Probe GitHub API route
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A workflow GITHUB_TOKEN is scoped to this repo, so /user returns 403 (github-actions
          # app). Probe a repo-scoped endpoint instead, which is what the token is actually for.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")
          if [ "$code" = "200" ]; then echo "github: PASS"; else echo "github: FAIL (http ${code})"; fi
