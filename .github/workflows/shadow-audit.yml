name: Shadow audit

# Implements WATCHER.md §1/§5/§15: Shadow audits each PR, posts the verdict, and the
# verdict gates the merge (CI green + Shadow Verified, docs/LOOP.md). Until this existed,
# nothing invoked shadow.py, so every PR merged without an audit.
# Rule: never print, echo, or commit a secret value. Output is the verdict only.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit deps
        run: python -m pip install --quiet pyyaml

      - name: Run Shadow audit
        id: shadow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OHGeminiAPI: ${{ secrets.OHGeminiAPI }}
          GEMINI_POOL_1: ${{ secrets.GEMINI_POOL_1 }}
          GEMINI_POOL_2: ${{ secrets.GEMINI_POOL_2 }}
          GEMINI_POOL_3: ${{ secrets.GEMINI_POOL_3 }}
          GEMINI_POOL_4: ${{ secrets.GEMINI_POOL_4 }}
          GEMINI_POOL_5: ${{ secrets.GEMINI_POOL_5 }}
          GEMINI_POOL_6: ${{ secrets.GEMINI_POOL_6 }}
          GEMINI_POOL_7: ${{ secrets.GEMINI_POOL_7 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          python3 shadow/shadow.py --pr "$PR_NUMBER" \
            --subject "PR #${PR_NUMBER}: ${PR_TITLE}" > /tmp/verdict.txt 2>&1
          cat /tmp/verdict.txt
          verdict="$(grep -m1 '^VERDICT:' /tmp/verdict.txt | sed 's/^VERDICT:[[:space:]]*//')"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

      - name: Comment the verdict on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Shadow audit (WATCHER.md §1)"
            echo
            cat /tmp/verdict.txt
            echo
            echo "_Automated audit by the Shadow workflow. Generated by an AI agent._"
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md

      - name: Gate the merge on an explicit rejection
        if: steps.shadow.outputs.verdict == 'REJECTED'
        run: |
          echo "Shadow REJECTED this pull request; the merge gate fails."
          exit 1

      - name: Warn when no verdict was produced
        if: steps.shadow.outputs.verdict == ''
        run: |
          echo "::warning::Shadow produced no verdict (all model routes failed). The gate is inconclusive; a human or Shadow must still approve the merge."
