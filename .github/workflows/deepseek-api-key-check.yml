name: Brain DeepSeek API Key Check

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  deepseek-key-check:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain deepseek-check')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    env:
      BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
    steps:
      - name: Test the existing Brain AI secret directly against DeepSeek
        id: check
        shell: bash
        run: |
          set +x
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("BRAIN_AI_API_KEY", "").strip()
          result = "CHECK_FAILED"
          detail = "The DeepSeek request could not be validated."
          if not key:
              result, detail = "CONFIG_MISSING", "The BRAIN_AI_API_KEY Actions secret is missing or empty."
          else:
              payload = {
                  "model": "deepseek-flash",
                  "messages": [{"role": "user", "content": "Reply with exactly BRAIN_DEEPSEEK_OK"}],
                  "max_tokens": 32,
                  "stream": False,
                  "thinking": {"type": "disabled"}
              }
              request = urllib.request.Request(
                  "https://api.deepseek.com/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "Accept": "application/json"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      body = json.loads(response.read().decode("utf-8"))
                      choices = body.get("choices", [])
                      message = choices[0].get("message", {}) if choices else {}
                      reply = message.get("content", "") if isinstance(message, dict) else ""
                      if response.status == 200 and isinstance(reply, str) and "BRAIN_DEEPSEEK_OK" in reply:
                          result, detail = "PASS", "The existing BRAIN_AI_API_KEY secret authenticated successfully with DeepSeek and returned the required response marker."
                      else:
                          result, detail = "INVALID_RESPONSE", "DeepSeek responded, but the expected response marker was not found."
              except urllib.error.HTTPError as exc:
                  if exc.code in (401, 403):
                      result, detail = "AUTH_FAILED", "DeepSeek rejected the key or its authorization (HTTP " + str(exc.code) + ")."
                  elif exc.code == 402:
                      result, detail = "BILLING_OR_BALANCE", "DeepSeek returned HTTP 402; check API account balance or billing."
                  elif exc.code == 429:
                      result, detail = "RATE_LIMITED", "DeepSeek rate-limited the test (HTTP 429)."
                  elif exc.code >= 500:
                      result, detail = "PROVIDER_ERROR", "DeepSeek returned a server error (HTTP " + str(exc.code) + ")."
                  else:
                      result, detail = "HTTP_ERROR", "DeepSeek returned HTTP " + str(exc.code) + "."
              except urllib.error.URLError:
                  result, detail = "NETWORK_ERROR", "Could not reach the DeepSeek API endpoint."
              except (TimeoutError, json.JSONDecodeError, UnicodeDecodeError):
                  result, detail = "RESPONSE_ERROR", "DeepSeek timed out or returned a non-JSON response."
              except Exception:
                  result, detail = "CHECK_FAILED", "The check failed unexpectedly; details were suppressed."
          print("RESULT=" + result)
          print("DETAIL=" + detail)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("result=" + result + "\n")
              out.write("detail=" + detail + "\n")
          if result != "PASS":
              raise SystemExit(1)
          PY
      - name: Report sanitized result on the initiating issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.check.outputs.result }}
          DETAIL: ${{ steps.check.outputs.detail }}
        with:
          script: |
            const result = process.env.RESULT || 'CHECK_FAILED';
            const detail = process.env.DETAIL || 'No sanitized result was produced.';
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Brain DeepSeek API key check\\n\\n**Result:** ' + result + '\\n\\n' + detail + '\\n\\nThe API key and raw provider response were not logged.\\n\\nWorkflow run: ' + runUrl
            });
