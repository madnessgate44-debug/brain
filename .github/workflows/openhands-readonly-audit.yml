name: OpenHands Read-only Brain Audit

on:
  workflow_dispatch:
  push:
    branches: [main, fix/openhands-audit-events-422]
    paths:
      - ".github/workflows/openhands-readonly-audit.yml"

permissions:
  contents: read

concurrency:
  group: openhands-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'madnessgate44-debug/brain' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Start OpenHands audit
        id: start
        shell: bash
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: main
        run: |
          set -euo pipefail
          if [ -z "${OPENHANDS_API_KEY:-}" ]; then
            echo "::error::Missing repository Actions secret OPENHANDS_API_KEY."
            exit 1
          fi

          cat > /tmp/openhands-prompt.txt <<'PROMPT'
          Audit Brain repository on the selected branch in READ-ONLY mode. Never modify files, commits, pull requests, issues, deployments, or settings. First verify the repository and branch are actually present in the workspace. If source access fails, report that blocker instead of claiming an audit. Inspect mission execution, agent orchestration, GitHub integration and permissions, workflows, tests, and end-to-end coverage. Cite exact paths and line numbers or logs, explain impact, separate verified findings from hypotheses, and prioritize repairs with acceptance criteria. Do not implement fixes. End the final answer with BRAIN_AUDIT_REPORT_BEGIN and BRAIN_AUDIT_REPORT_END markers surrounding the report.
          PROMPT

          jq -n --arg repository "$REPOSITORY" --arg branch "$BRANCH" --rawfile text /tmp/openhands-prompt.txt '{initial_message:{content:[{type:"text",text:$text}]},selected_repository:$repository,selected_branch:$branch}' > /tmp/openhands-payload.json

          response="$(curl --silent --show-error --fail-with-body --retry 3             --request POST "https://app.all-hands.dev/api/v1/app-conversations"             --header "Authorization: Bearer ${OPENHANDS_API_KEY}"             --header "Content-Type: application/json"             --data @/tmp/openhands-payload.json)"

          task_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          conversation_id="$(printf '%s' "$response" | jq -r '.app_conversation_id // empty')"
          status="$(printf '%s' "$response" | jq -r '.status // "UNKNOWN"')"

          if [ -z "$task_id" ]; then
            echo "::error::OpenHands did not return a start-task ID. Response: $(printf '%s' "$response" | jq -c '{status,error,message}')"
            exit 1
          fi

          for attempt in $(seq 1 40); do
            if [ -z "$conversation_id" ] || [ "$status" != "READY" ]; then
              poll="$(curl --silent --show-error --fail-with-body --retry 3                 --get "https://app.all-hands.dev/api/v1/app-conversations/start-tasks"                 --header "Authorization: Bearer ${OPENHANDS_API_KEY}"                 --data-urlencode "ids=$task_id")"
              status="$(printf '%s' "$poll" | jq -r 'if type == "array" then (.[0].status // "UNKNOWN") else (.status // "UNKNOWN") end')"
              conversation_id="$(printf '%s' "$poll" | jq -r 'if type == "array" then (.[0].app_conversation_id // empty) else (.app_conversation_id // empty) end')"
            fi

            if [ "$status" = "READY" ] && [ -n "$conversation_id" ]; then
              break
            fi
            if [ "$status" = "ERROR" ]; then
              echo "::error::OpenHands failed while preparing the conversation."
              exit 1
            fi
            sleep 15
          done

          if [ -z "$conversation_id" ] || [ "$status" != "READY" ]; then
            echo "::error::Timed out waiting for OpenHands to prepare the audit conversation (last status: $status)."
            exit 1
          fi

          echo "conversation_id=$conversation_id" >> "$GITHUB_OUTPUT"
          echo "conversation_url=https://app.all-hands.dev/conversations/$conversation_id" >> "$GITHUB_OUTPUT"
          echo "OpenHands conversation ready: $conversation_id"

      - name: Verify repository connection and wait for audit completion
        id: monitor
        shell: bash
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          CONVERSATION_ID: ${{ steps.start.outputs.conversation_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: main
        run: |
          set -euo pipefail
          if [ -z "${CONVERSATION_ID:-}" ]; then
            echo "::error::No OpenHands conversation ID was returned."
            exit 1
          fi
          headers=(-H "Authorization: Bearer ${OPENHANDS_API_KEY}" -H "Accept: application/json")
          terminal=""
          for attempt in $(seq 1 120); do
            response="$(curl --silent --show-error --fail-with-body --retry 3 \
              --get "https://app.all-hands.dev/api/v1/app-conversations" \
              "${headers[@]}" --data-urlencode "ids=$CONVERSATION_ID")"
            printf '%s' "$response" > /tmp/openhands-conversation.json
            cp /tmp/openhands-conversation.json "$GITHUB_WORKSPACE/openhands-conversation.json"
            repository="$(printf '%s' "$response" | jq -r 'if type == "array" then (.[0].selected_repository // "") else (.selected_repository // "") end')"
            branch="$(printf '%s' "$response" | jq -r 'if type == "array" then (.[0].selected_branch // "") else (.selected_branch // "") end')"
            sandbox="$(printf '%s' "$response" | jq -r 'if type == "array" then (.[0].sandbox_status // "") else (.sandbox_status // "") end')"
            execution="$(printf '%s' "$response" | jq -r 'if type == "array" then (.[0].execution_status // "") else (.execution_status // "") end')"

            echo "OpenHands check $attempt: repository='$repository' branch='$branch' sandbox='$sandbox' execution='$execution'"

            if [ -n "$repository" ] && [ "$repository" != "$REPOSITORY" ]; then
              echo "::error::OpenHands attached the wrong repository: $repository"
              exit 1
            fi
            if [ "$sandbox" = "ERROR" ] || [ "$sandbox" = "MISSING" ]; then
              echo "::error::OpenHands sandbox failed: $sandbox"
              exit 1
            fi
            if [ "$execution" = "error" ] || [ "$execution" = "stuck" ]; then
              echo "::error::OpenHands audit terminated with execution_status=$execution"
              exit 1
            fi
            if [ "$execution" = "waiting_for_confirmation" ]; then
              echo "::error::OpenHands audit is blocked waiting for confirmation. Open the conversation URL in the workflow summary."
              exit 1
            fi
            if [ "$execution" = "finished" ]; then
              if [ "$repository" != "$REPOSITORY" ]; then
                echo "::error::Audit finished without verified repository connection. Expected '$REPOSITORY', got '$repository'."
                exit 1
              fi
              if [ "$branch" != "$BRANCH" ]; then
                echo "::error::Audit finished without verified branch connection. Expected '$BRANCH', got '$branch'."
                exit 1
              fi
              terminal="finished"
              break
            fi
            sleep 30
          done

          if [ "$terminal" != "finished" ]; then
            echo "::error::Timed out waiting for OpenHands audit completion."
            exit 1
          fi

          # Fetch all event pages; OpenHands reports can be emitted in tool observations, not only MessageEvent records.
          page_id=""
          : > /tmp/openhands-events-aggregate.json
          printf '{"items":[]}' > /tmp/openhands-events-aggregate.json
          for page_number in $(seq 1 20); do
            page_args=(--data-urlencode "limit=100" --data-urlencode "sort_order=TIMESTAMP_DESC")
            if [ -n "$page_id" ]; then page_args+=(--data-urlencode "page_id=$page_id"); fi
            event_status="$(curl --silent --show-error --retry 3 \
              --output /tmp/openhands-events-page.json --write-out '%{http_code}' \
              --get "https://app.all-hands.dev/api/v1/conversation/$CONVERSATION_ID/events/search" \
              "${headers[@]}" "${page_args[@]}")"
            if [ "$event_status" != "200" ]; then
              echo "::error::OpenHands event search returned HTTP ${event_status:-unknown} on page ${page_number}."
              head -c 2000 /tmp/openhands-events-page.json || true
              echo
              exit 1
            fi
            python3 - <<'PY'
          import json
          from pathlib import Path
          aggregate_path = Path("/tmp/openhands-events-aggregate.json")
          page_path = Path("/tmp/openhands-events-page.json")
          aggregate = json.loads(aggregate_path.read_text(encoding="utf-8"))
          page = json.loads(page_path.read_text(encoding="utf-8"))
          aggregate["items"].extend(page.get("items", []))
          aggregate["next_page_id"] = page.get("next_page_id")
          aggregate_path.write_text(json.dumps(aggregate), encoding="utf-8")
          PY
            page_id="$(python3 -c 'import json; print(json.load(open("/tmp/openhands-events-page.json", encoding="utf-8")).get("next_page_id") or "")')"
            if [ -z "$page_id" ]; then break; fi
            if [ "$page_number" -eq 20 ]; then
              echo "::error::OpenHands event history exceeded the 2000-event safety cap; report extraction refused to use a partial history."
              exit 1
            fi
          done
          cp /tmp/openhands-events-aggregate.json "$GITHUB_WORKSPACE/openhands-events.json"
          python3 - <<'PY'
          import json, os, sys
          events_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "openhands-events.json")
          with open(events_path, encoding="utf-8") as f:
              data = json.load(f)
          items = data.get("items", []) if isinstance(data, dict) else []
          def flatten(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  return "\n".join(flatten(item) for item in value.values())
              if isinstance(value, list):
                  return "\n".join(flatten(item) for item in value)
              return ""
          # Search all event types, including ActionEvent/ObservationEvent payloads.
          # OpenHands may emit the marked report through a terminal observation.
          combined = "\n".join(flatten(event) for event in reversed(items))
          report = ""
          marker_start = "BRAIN_AUDIT_REPORT_BEGIN"
          marker_end = "BRAIN_AUDIT_REPORT_END"
          start = combined.rfind(marker_start)
          if start >= 0:
              end = combined.find(marker_end, start + len(marker_start))
              if end >= 0:
                  report = combined[start + len(marker_start):end].strip()
          if not report:
              print("::error::OpenHands finished but no marked final audit report was found in conversation events.", file=sys.stderr)
              print(f"Event payloads scanned: {len(items)}; no marked report found.", file=sys.stderr)
              sys.exit(1)
          report_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "openhands-audit-report.md")
          with open(report_path, "w", encoding="utf-8") as f:
              f.write("# OpenHands Brain Audit\n\n")
              f.write(report + "\n")
          print(f"Audit report extracted from {len(items)} event records.")
          PY
          echo "report_path=openhands-audit-report.md" >> "$GITHUB_OUTPUT"

      - name: Publish audit report and evidence
        if: always() && steps.start.outputs.conversation_url != ''
        shell: bash
        env:
          CONVERSATION_URL: ${{ steps.start.outputs.conversation_url }}
          CONVERSATION_ID: ${{ steps.start.outputs.conversation_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## OpenHands Read-only Brain Audit"
            echo
            echo "- Conversation: [$CONVERSATION_ID]($CONVERSATION_URL)"
            echo "- Requested repository/branch: madnessgate44-debug/brain / main"
            echo "- Job status: $JOB_STATUS"
            if [ -f "$GITHUB_WORKSPACE/openhands-audit-report.md" ]; then
              echo
              cat "$GITHUB_WORKSPACE/openhands-audit-report.md"
            else
              echo
              echo "Audit report was not verified. Inspect the failing step logs and conversation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always() && steps.start.outputs.conversation_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: openhands-brain-audit-evidence
          path: |
            ${{ github.workspace }}/openhands-audit-report.md
            ${{ github.workspace }}/openhands-conversation.json
            ${{ github.workspace }}/openhands-events.json
          if-no-files-found: ignore
          retention-days: 14
