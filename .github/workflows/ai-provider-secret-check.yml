name: Brain Gemini API Secret Check

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  provider-check:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain ai-check')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Test Gemini API without revealing credentials
        id: check
        shell: bash
        env:
          BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL }}
          BRAIN_AI_MODEL: ${{ secrets.BRAIN_AI_MODEL }}
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
        run: |
          set +x
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ.get("BRAIN_AI_BASE_URL", "").strip().rstrip("/") or "https://generativelanguage.googleapis.com/v1beta"
          model = os.environ.get("BRAIN_AI_MODEL", "").strip() or "gemini-2.5-flash"
          api_key = os.environ.get("BRAIN_AI_API_KEY", "").strip()

          def report(result, detail):
              print("RESULT=" + result)
              print("DETAIL=" + detail)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("result=" + result + "\n")
                  out.write("detail=" + detail.replace("\n", " ") + "\n")

          if not api_key:
              report("CONFIG_MISSING", "The BRAIN_AI_API_KEY Actions secret is missing or empty.")
              raise SystemExit(0)

          parsed = urllib.parse.urlparse(base_url)
          if parsed.scheme != "https" or not parsed.netloc or parsed.username or parsed.password:
              report("CONFIG_INVALID", "The base URL must be HTTPS without embedded credentials.")
              raise SystemExit(0)

          model_path = urllib.parse.quote(model, safe="-._")
          url = base_url + "/models/" + model_path + ":generateContent"
          payload = {
              "contents": [{"parts": [{"text": "Reply with exactly: OK"}]}],
              "generationConfig": {"maxOutputTokens": 8, "temperature": 0}
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "x-goog-api-key": api_key,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          result = "UNKNOWN"
          detail = "Provider response could not be validated."
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  body = json.loads(response.read().decode("utf-8"))
              candidates = body.get("candidates")
              candidate = candidates[0] if isinstance(candidates, list) and candidates else {}
              content = candidate.get("content", {}) if isinstance(candidate, dict) else {}
              parts = content.get("parts", []) if isinstance(content, dict) else []
              if 200 <= status < 300 and isinstance(parts, list) and any(isinstance(part, dict) and isinstance(part.get("text"), str) for part in parts):
                  result = "PASS"
                  detail = "Gemini returned a valid generateContent response."
              else:
                  result = "INVALID_RESPONSE"
                  detail = "Gemini responded, but the payload did not match the expected generateContent format."
          except urllib.error.HTTPError as exc:
              status = exc.code
              if status in (401, 403):
                  result, detail = "AUTH_FAILED", "Google rejected authentication or permissions (HTTP " + str(status) + ")."
              elif status == 404:
                  result, detail = "ENDPOINT_OR_MODEL_ERROR", "Google returned HTTP 404; check the Gemini API base URL and model setting."
              elif status == 429:
                  result, detail = "RATE_LIMITED", "Gemini API rate-limited the request (HTTP 429)."
              elif status >= 500:
                  result, detail = "PROVIDER_ERROR", "Google returned a server error (HTTP " + str(status) + ")."
              else:
                  result, detail = "HTTP_ERROR", "Google returned HTTP " + str(status) + "."
          except urllib.error.URLError:
              result, detail = "NETWORK_ERROR", "Could not reach the configured Gemini API endpoint."
          except (TimeoutError, json.JSONDecodeError, UnicodeDecodeError):
              result, detail = "RESPONSE_ERROR", "Gemini API timed out or returned a non-JSON response."
          except Exception:
              result, detail = "CHECK_ERROR", "The check failed unexpectedly; details were suppressed to avoid leaking configuration."

          report(result, detail)
          PY
      - name: Report sanitized result on the issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.check.outputs.result }}
          DETAIL: ${{ steps.check.outputs.detail }}
        with:
          script: |
            const result = process.env.RESULT || 'CHECK_FAILED';
            const detail = process.env.DETAIL || 'No sanitized result was produced.';
            const body = [
              '## Brain Gemini API secret check',
              '',
              '**Result:** ' + result,
              '',
              detail,
              '',
              'This check never prints the API key or raw provider response. It sends one minimal Gemini generateContent request.',
              'The standard Gemini endpoint and model are defaults; if needed, configure BRAIN_AI_BASE_URL and BRAIN_AI_MODEL as repository Actions secrets.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
