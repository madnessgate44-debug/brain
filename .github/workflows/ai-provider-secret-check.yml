name: Brain AI Provider Secret Check

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  provider-check:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain ai-check')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Test configured AI provider without revealing credentials
        id: check
        shell: bash
        env:
          BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL }}
          BRAIN_AI_MODEL: ${{ secrets.BRAIN_AI_MODEL }}
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
        run: |
          set +x
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          # Only the API key is required for the standard OpenAI configuration.
          # Other OpenAI-compatible providers must set their own base URL and model.
          base_url = os.environ.get("BRAIN_AI_BASE_URL", "").strip().rstrip("/") or "https://api.openai.com/v1"
          model = os.environ.get("BRAIN_AI_MODEL", "").strip() or "gpt-4o-mini"
          api_key = os.environ.get("BRAIN_AI_API_KEY", "").strip()

          if not api_key:
              print("RESULT=CONFIG_MISSING")
              print("Missing setting: BRAIN_AI_API_KEY")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("result=CONFIG_MISSING\n")
                  out.write("detail=The BRAIN_AI_API_KEY Actions secret is missing or empty.\n")
              raise SystemExit(0)

          parsed = urllib.parse.urlparse(base_url)
          if parsed.scheme != "https" or not parsed.netloc or parsed.username or parsed.password:
              print("RESULT=CONFIG_INVALID")
              print("The configured base URL must be HTTPS without embedded credentials.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("result=CONFIG_INVALID\n")
                  out.write("detail=The base URL must be HTTPS and must not contain embedded credentials.\n")
              raise SystemExit(0)

          url = base_url + "/chat/completions"
          payload = {
              "model": model,
              "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
              "max_tokens": 8,
              "temperature": 0
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          result = "UNKNOWN"
          detail = "Provider response could not be validated."
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  body = json.loads(response.read().decode("utf-8"))
              choices = body.get("choices")
              message = choices[0].get("message", {}) if isinstance(choices, list) and choices else {}
              if 200 <= status < 300 and isinstance(message, dict) and isinstance(message.get("content"), str):
                  result = "PASS"
                  detail = "Provider returned a valid chat-completions response."
              else:
                  result = "INVALID_RESPONSE"
                  detail = "Provider responded, but the payload did not match the expected chat-completions format."
          except urllib.error.HTTPError as exc:
              status = exc.code
              if status in (401, 403):
                  result, detail = "AUTH_FAILED", "Provider rejected authentication or permissions (HTTP " + str(status) + ")."
              elif status == 404:
                  result, detail = "ENDPOINT_OR_MODEL_ERROR", "Provider returned HTTP 404; check the base URL path and model setting."
              elif status == 429:
                  result, detail = "RATE_LIMITED", "Provider rate-limited the request (HTTP 429)."
              elif status >= 500:
                  result, detail = "PROVIDER_ERROR", "Provider returned a server error (HTTP " + str(status) + ")."
              else:
                  result, detail = "HTTP_ERROR", "Provider returned HTTP " + str(status) + "."
          except urllib.error.URLError:
              result, detail = "NETWORK_ERROR", "Could not reach the configured provider endpoint."
          except (TimeoutError, json.JSONDecodeError, UnicodeDecodeError):
              result, detail = "RESPONSE_ERROR", "Provider timed out or returned a non-JSON response."
          except Exception:
              result, detail = "CHECK_ERROR", "The check failed unexpectedly; details were suppressed to avoid leaking configuration."

          print("RESULT=" + result)
          print("DETAIL=" + detail)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("result=" + result + "\n")
              out.write("detail=" + detail.replace("\n", " ") + "\n")
          PY
      - name: Report sanitized result on the issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.check.outputs.result }}
          DETAIL: ${{ steps.check.outputs.detail }}
        with:
          script: |
            const result = process.env.RESULT || 'CHECK_FAILED';
            const detail = process.env.DETAIL || 'No sanitized result was produced.';
            const body = [
              '## Brain AI provider secret check',
              '',
              '**Result:** ' + result,
              '',
              detail,
              '',
              'This check never prints the API key or provider response body. It sends one minimal chat-completions request.',
              'If this API key belongs to a provider other than OpenAI, configure BRAIN_AI_BASE_URL and BRAIN_AI_MODEL as repository Actions secrets before rerunning.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
