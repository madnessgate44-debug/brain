name: Brain AI Provider Secret Check

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  provider-check:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '/brain ai-check')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      issues: write
    steps:
      - name: Test the production OpenAI-compatible endpoint without revealing credentials
        id: check
        shell: bash
        env:
          BRAIN_AI_BASE_URL: ${{ secrets.BRAIN_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          BRAIN_AI_MODEL: ${{ vars.BRAIN_AI_MODEL }}
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
        run: |
          set +x
          python - <<'PY'
          import json, os, re, time
          import urllib.error, urllib.parse, urllib.request

          base_url = os.environ.get("BRAIN_AI_BASE_URL", "").strip().rstrip("/")
          model = os.environ.get("BRAIN_AI_MODEL", "").strip()
          api_key = os.environ.get("BRAIN_AI_API_KEY", "").strip()

          def report(result, detail):
              print("RESULT=" + result)
              print("DETAIL=" + detail)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("result=" + result + "\n")
                  out.write("detail=" + detail.replace("\n", " ") + "\n")

          def safe_status(payload):
              error = payload.get("error", {}) if isinstance(payload, dict) else {}
              if not isinstance(error, dict):
                  return ""
              for key in ("status", "code", "type"):
                  value = error.get(key)
                  if isinstance(value, str) and re.fullmatch(r"[A-Za-z][A-Za-z0-9_.-]{1,63}", value):
                      return value
              return ""

          def retry_delay(headers, payload, fallback):
              value = headers.get("Retry-After", "")
              try:
                  if value:
                      return min(60.0, max(0.0, float(value)))
              except ValueError:
                  pass
              error = payload.get("error", {}) if isinstance(payload, dict) else {}
              details = error.get("details", []) if isinstance(error, dict) else []
              for item in details if isinstance(details, list) else []:
                  value = item.get("retryDelay") if isinstance(item, dict) else None
                  if isinstance(value, str) and re.fullmatch(r"\d+(?:\.\d+)?s", value):
                      return min(60.0, max(0.0, float(value[:-1])))
              return min(60.0, max(1.0, fallback))

          if not api_key:
              report("CONFIG_MISSING", "The BRAIN_AI_API_KEY Actions secret is missing or empty.")
              raise SystemExit(0)
          if not model:
              report("CONFIG_MISSING", "The BRAIN_AI_MODEL Actions repository variable is missing or empty.")
              raise SystemExit(0)
          parsed = urllib.parse.urlparse(base_url)
          if parsed.scheme != "https" or not parsed.netloc or parsed.username or parsed.password:
              report("CONFIG_INVALID", "BRAIN_AI_BASE_URL must be HTTPS without embedded credentials.")
              raise SystemExit(0)
          if parsed.hostname == "generativelanguage.googleapis.com" and parsed.path.rstrip("/") in ("/v1beta", "/v1"):
              base_url += "/openai"
          url = base_url + "/chat/completions"
          payload = {
              "model": model,
              "messages": [{"role": "user", "content": "Reply with exactly BRAIN_PROVIDER_OK"}],
              "max_tokens": 16,
              "temperature": 0
          }
          result, detail = "UNKNOWN", "Provider response could not be validated."
          for attempt in range(3):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + api_key,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      body = json.loads(response.read().decode("utf-8"))
                  choices = body.get("choices", [])
                  choice = choices[0] if isinstance(choices, list) and choices else {}
                  message = choice.get("message", {}) if isinstance(choice, dict) else {}
                  text = message.get("content", "") if isinstance(message, dict) else ""
                  if 200 <= status < 300 and isinstance(text, str) and "BRAIN_PROVIDER_OK" in text:
                      result, detail = "PASS", "The configured model returned the required marker through /chat/completions."
                  else:
                      result, detail = "INVALID_RESPONSE", "Provider responded, but the expected chat-completions marker was not returned."
                  break
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      error_payload = json.loads(raw.decode("utf-8"))
                  except (ValueError, UnicodeDecodeError):
                      error_payload = {}
                  if exc.code in (429, 500, 502, 503, 504) and attempt < 2:
                      time.sleep(retry_delay(exc.headers, error_payload, 2 ** (attempt + 1)))
                      continue
                  provider_status = safe_status(error_payload)
                  suffix = (" Provider status: " + provider_status + ".") if provider_status else ""
                  if exc.code in (401, 403):
                      result, detail = "AUTH_FAILED", "Provider rejected authentication or permissions (HTTP " + str(exc.code) + ")." + suffix
                  elif exc.code == 404:
                      result, detail = "ENDPOINT_OR_MODEL_ERROR", "Provider returned HTTP 404; check base URL and model." + suffix
                  elif exc.code == 429:
                      result, detail = "RATE_LIMITED", "Provider rate-limited the request (HTTP 429); retry guidance was honored up to the bounded attempt limit." + suffix
                  elif exc.code >= 500:
                      result, detail = "PROVIDER_ERROR", "Provider returned HTTP " + str(exc.code) + "." + suffix
                  else:
                      result, detail = "HTTP_ERROR", "Provider returned HTTP " + str(exc.code) + "." + suffix
                  break
              except urllib.error.URLError:
                  result, detail = "NETWORK_ERROR", "Could not reach the configured OpenAI-compatible endpoint."
                  break
              except (TimeoutError, json.JSONDecodeError, UnicodeDecodeError):
                  result, detail = "RESPONSE_ERROR", "Provider timed out or returned a non-JSON response."
                  break
              except Exception:
                  result, detail = "CHECK_ERROR", "The check failed unexpectedly; configuration details were suppressed."
                  break
          report(result, detail)
          if result != "PASS":
              raise SystemExit(1)
          PY
      - name: Report sanitized result on the issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.check.outputs.result }}
          DETAIL: ${{ steps.check.outputs.detail }}
        with:
          script: |
            const result = process.env.RESULT || 'CHECK_FAILED';
            const detail = process.env.DETAIL || 'No sanitized result was produced.';
            const body = [
              '## Brain AI provider secret check',
              '',
              '**Result:** ' + result,
              '',
              detail,
              '',
              'This sends one minimal request (with bounded retries) to the same OpenAI-compatible /chat/completions endpoint used by the production provider. The API key and raw provider body are never printed.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
