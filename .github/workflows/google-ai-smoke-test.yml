name: Google AI key smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-ai-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Google AI Studio credential with a minimal live request
        env:
          BRAIN_AI_API_KEY: ${{ secrets.BRAIN_AI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.environ.get("BRAIN_AI_API_KEY", "").strip()
          if not key:
              print("FAIL: BRAIN_AI_API_KEY is unavailable to this workflow.")
              sys.exit(1)

          payload = json.dumps({
              "model": "gemini-2.5-flash",
              "messages": [
                  {"role": "user", "content": "Reply with exactly: BRAIN_API_OK"}
              ],
              "temperature": 0,
              "max_tokens": 12,
          }).encode("utf-8")
          request = Request(
              "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
              data=payload,
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urlopen(request, timeout=35) as response:
                  data = json.loads(response.read().decode("utf-8"))
          except HTTPError as exc:
              print(f"FAIL: Google AI Studio returned HTTP {exc.code}; response details withheld.")
              sys.exit(1)
          except (URLError, TimeoutError, OSError):
              print("FAIL: Could not complete the Google AI Studio request; details withheld.")
              sys.exit(1)
          except (ValueError, KeyError, TypeError):
              print("FAIL: Google AI Studio returned an unexpected response.")
              sys.exit(1)

          try:
              message = data["choices"][0]["message"]["content"]
          except (KeyError, IndexError, TypeError):
              print("FAIL: Response did not contain a chat completion.")
              sys.exit(1)

          if not isinstance(message, str) or not message.strip():
              print("FAIL: Google returned an empty completion.")
              sys.exit(1)

          print("PASS: BRAIN_AI_API_KEY was accepted and Google AI Studio returned a completion.")
          print("Credential value and model response were not printed.")
          PY
