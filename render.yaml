services:
  - type: web
    name: brain-api
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeploy: false
    buildCommand: pip install .
    startCommand: uvicorn brain.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: brain-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BRAIN_DATABASE__SQLITE_PATH
        value: /var/data/brain.db
      - key: BRAIN_WORKSPACE__ROOT
        value: /var/data/workspace
      - key: BRAIN_SYSTEM__ENVIRONMENT
        value: production
      - key: BRAIN_CORS_ORIGINS
        value: https://madnessgate44-debug.github.io
      - key: BRAIN_CONTROL_API_KEY
        generateValue: true
      - key: BRAIN_AI_BASE_URL
        sync: false
      - key: BRAIN_AI_MODEL
        sync: false
      - key: BRAIN_AI_API_KEY
        sync: false
